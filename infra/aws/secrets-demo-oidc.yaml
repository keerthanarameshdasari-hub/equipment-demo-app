AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  equipDemo secrets demo: GitHub Actions OIDC trust, one harmless test secret in
  Secrets Manager, and a least-privilege role that can read ONLY that secret,
  ONLY from this repository's AWS-DEMO environment. No long-lived access keys.

Parameters:
  GitHubOwner:
    Type: String
    Default: keerthanarameshdasari-hub
  GitHubRepo:
    Type: String
    Default: equipment-demo-app
  GitHubEnvironment:
    Type: String
    Default: AWS-DEMO
    Description: GitHub Environment the workflow job runs in (part of the trusted token subject)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      'false' if this AWS account already has the token.actions.githubusercontent.com
      OIDC provider (an account can have only one).

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DemoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: equipdemo/ci-demo-secret
      Description: Harmless test value for the equipDemo secrets demo. Not a real credential.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  SecretsDemoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: equipdemo-github-secrets-demo
      Description: Assumed by GitHub Actions (OIDC) to read the equipDemo demo secret only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs in this repo's AWS-DEMO environment. Pull requests, forks and other
                # branches/repos get a different subject and are refused.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: read-demo-secret-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DemoSecret

Outputs:
  RoleArn:
    Description: Set as AWS_ROLE_ARN on the AWS-DEMO GitHub Environment
    Value: !GetAtt SecretsDemoRole.Arn
  SecretName:
    Description: Set as AWS_DEMO_SECRET_ID on the AWS-DEMO GitHub Environment
    Value: equipdemo/ci-demo-secret
  Region:
    Description: Set as AWS_REGION on the AWS-DEMO GitHub Environment
    Value: !Ref AWS::Region
