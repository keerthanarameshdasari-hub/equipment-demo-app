name: Secrets demo (GitHub secrets + AWS OIDC)

# Controlled secrets exercise. It never prints a secret value and never puts
# anything into the app build.
#
#   github-secret  baseline: reads a GitHub encrypted secret (DEMO_GITHUB_SECRET)
#   aws-oidc       GitHub OIDC -> short-lived AWS role (no stored AWS keys) ->
#                  reads ONE harmless test secret from AWS Secrets Manager, and
#                  proves the role cannot do anything else
#
# Each job passes safely when its prerequisites are missing, listing what to set up.
# Fork safety: manual trigger only (no pull_request / pull_request_target), so
# pull requests from forks can never run it; the AWS job also runs only in the
# AWS-DEMO environment, which is limited to main. See docs/SECRETS.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-demo
  cancel-in-progress: false

jobs:
  github-secret:
    name: GitHub encrypted secret (baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read DEMO_GITHUB_SECRET without printing it
        env:
          DEMO_SECRET: ${{ secrets.DEMO_GITHUB_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "::notice title=Not configured::Repository secret DEMO_GITHUB_SECRET does not exist. Create it under Settings → Secrets and variables → Actions with any harmless text."
            echo "### GitHub secret: not configured (see docs/SECRETS.md)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # GitHub masks secret values in logs automatically; we still never echo it.
          length=${#DEMO_SECRET}
          echo "✓ DEMO_GITHUB_SECRET is available to this job (${length} characters). Value not printed."
          echo "### GitHub secret: available (${length} characters, value never printed)" >> "$GITHUB_STEP_SUMMARY"

  aws-oidc:
    name: AWS Secrets Manager via OIDC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Environment: limits who can run this (deployment branch: main) and gives the
    # OIDC token the subject repo:<owner>/<repo>:environment:AWS-DEMO, which is
    # the ONLY subject the AWS role trusts.
    environment:
      name: AWS-DEMO
    permissions:
      contents: read
      id-token: write # request a GitHub OIDC token; no AWS keys are stored anywhere
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SECRET_ID: ${{ vars.AWS_DEMO_SECRET_ID }}
    steps:
      - name: Check prerequisites
        id: prereq
        run: |
          missing=()
          [ -n "$AWS_ROLE_ARN" ] || missing+=("Environment variable AWS_ROLE_ARN on AWS-DEMO (output RoleArn of aws/secrets-demo-oidc.yaml)")
          [ -n "$AWS_REGION" ] || missing+=("Environment variable AWS_REGION on AWS-DEMO (e.g. ap-south-1)")
          [ -n "$SECRET_ID" ] || missing+=("Environment variable AWS_DEMO_SECRET_ID on AWS-DEMO (output SecretName of the template)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AWS demo not configured::Skipped safely; nothing was requested from AWS. Missing: ${missing[*]}"
            {
              echo "### AWS OIDC demo: not configured (skipped safely)"
              echo ""
              echo "Nothing was requested from AWS. Prerequisites still missing:"
              for m in "${missing[@]}"; do echo "- $m"; done
              echo ""
              echo "One-time AWS setup: deploy \`aws/secrets-demo-oidc.yaml\` (CloudFormation). See docs/SECRETS.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume the least-privilege role with GitHub OIDC (short-lived credentials)
        if: steps.prereq.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: equipdemo-secrets-demo-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Retrieve the harmless test secret (value masked, never printed)
        if: steps.prereq.outputs.configured == 'true'
        run: |
          # Capture without echoing, then register the value as a mask before anything else.
          if ! value=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text 2>err.txt); then
            echo "::error title=Secrets Manager::Could not read the demo secret: $(grep -o 'AccessDenied\|ResourceNotFound[A-Za-z]*\|ExpiredToken' err.txt | head -1)"
            exit 1
          fi
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$value"
          [ -n "$value" ] || { echo "::error::The secret is empty"; exit 1; }
          echo "✓ Retrieved the demo secret (${#value} characters). Value masked and not printed."
          # The value is not written to files, outputs, artifacts or the environment.
          unset value

      - name: Prove least privilege (anything else must be denied)
        if: steps.prereq.outputs.configured == 'true'
        run: |
          if aws secretsmanager list-secrets --max-results 1 > /dev/null 2>err.txt; then
            echo "::error title=Role too broad::The role can list secrets; it should only be able to read the one demo secret."
            exit 1
          fi
          grep -q 'AccessDenied' err.txt && echo "✓ list-secrets denied, as intended"
          if aws s3api list-buckets > /dev/null 2>err.txt; then
            echo "::error title=Role too broad::The role can list S3 buckets."
            exit 1
          fi
          echo "✓ s3 list-buckets denied, as intended"
          {
            echo "### AWS OIDC demo: passed"
            echo ""
            echo "- Short-lived credentials from GitHub OIDC (15 min); no AWS access keys stored in GitHub"
            echo "- Read 1 harmless secret from Secrets Manager; value masked and never printed"
            echo "- Least privilege verified: listing secrets and S3 buckets was denied"
          } >> "$GITHUB_STEP_SUMMARY"
