name: Bare RN migration verify

# Temporary workflow for the Expo -> bare React Native migration (Phase 1).
# 1. Syncs package-lock.json with package.json and commits it back
#    (the authoring environment cannot reach the npm registry).
# 2. Runs tests, typecheck and lint.
# 3. Builds the Android release APK and uploads it.
# Uses no secrets. Replaced by proper CI/release workflows in Phase 2.
on:
  push:
    branches: [chore/phase1-baseline]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migration-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies (and sync lockfile)
        run: .github/scripts/run-annotated.sh "npm install" error npm install --no-audit --no-fund

      - name: Commit lockfile if it changed
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package-lock.json after removing Expo [skip ci]"
            git push
          else
            echo "package-lock.json already in sync"
          fi

      - name: Unit tests
        run: .github/scripts/run-annotated.sh "Jest" error npm test -- --ci

      - name: TypeScript check
        run: .github/scripts/run-annotated.sh "tsc" error npm run typecheck

      - name: Lint (informational)
        run: .github/scripts/run-annotated.sh "ESLint" warning npm run lint

      - name: Assemble release APK
        working-directory: android
        run: ../.github/scripts/run-annotated.sh "Gradle" error ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: equipdemo-bare-rn-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
