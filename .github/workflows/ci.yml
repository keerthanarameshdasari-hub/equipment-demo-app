name: CI

# Fast checks on every push and pull request. Uses no secrets: tests run
# against the mock data source, never the live backend.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile must be in sync)
        run: .github/scripts/run-annotated.sh "npm ci" error npm ci --no-audit --no-fund

      - name: Lint
        run: .github/scripts/run-annotated.sh "ESLint" error npm run lint

      - name: TypeScript check
        run: .github/scripts/run-annotated.sh "tsc" error npm run typecheck

      - name: Unit and UI tests
        run: .github/scripts/run-annotated.sh "Jest" error npm test -- --ci --json --outputFile=jest-results.json

      - name: Test summary
        if: always()
        run: |
          [ -f jest-results.json ] || exit 0
          node -e "const r=require('./jest-results.json');console.log('::notice title=Test results::'+r.numPassedTests+' passed, '+r.numFailedTests+' failed, '+r.numTotalTests+' total in '+r.numTotalTestSuites+' suites')"
