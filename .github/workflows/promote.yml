name: Promote release candidate

# Moves an existing release candidate one stage forward, WITHOUT rebuilding it:
#   DEV (recorded by release.yml) -> SIT -> QA -> UAT -> PRE-PROD -> PROD
# See docs/STAGES.md for each stage's purpose, checks, entry/exit criteria and approver.
#
#   verify  integrity of the stored binary, stage order, approval gate configured
#   checks  runs in the stage's GitHub Environment: waits for required reviewers,
#           then runs that stage's checks with that environment's variables/secrets
#   record  only if every check passed: append the stage to release-record.json
#           (PROD: final tag + release with the same files)
#
# Store publishing is NOT done here: see publish.yml (publishing adapter).
#
# A failed check stops the run before "record", so the stage is not recorded and
# the next stage refuses to start. No app store is contacted.

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Release candidate tag (e.g. v1.1.2-rc.1)
        required: true
        type: string
      stage:
        description: Stage to enter (must be the next stage for this candidate)
        required: true
        type: choice
        options: [SIT, QA, UAT, PRE-PROD, PROD]
      notes:
        description: Notes / sign-off (required for QA and UAT, e.g. what was tested)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.rc_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RC_TAG: ${{ inputs.rc_tag }}
  STAGE: ${{ inputs.stage }}

jobs:
  verify:
    name: Verify candidate for ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # independent copy in CI artifact storage
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
      resume: ${{ steps.order.outputs.resume }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate request
        run: node -e "require('./scripts/release/lib').parseRcTag(process.argv[1])" "$RC_TAG"

      - name: Download the candidate from its GitHub pre-release
        run: gh release download "$RC_TAG" --dir rc && ls -l rc

      - name: Verify checksum, manifest and source revision
        id: verify
        run: |
          commit=$(gh api "repos/$GH_REPO/commits/$RC_TAG" --jq .sha)
          version=$(node -p "require('./scripts/release/lib').parseRcTag(process.argv[1]).version" "$RC_TAG")
          node scripts/release/cli.js verify rc --commit "$commit" --version "$version"
          sha256=$(sha256sum rc/*.apk | cut -d' ' -f1)
          { echo "commit=$commit"; echo "version=$version"; echo "sha256=$sha256"; } >> "$GITHUB_OUTPUT"

      - name: Cross-check against the copy in CI artifact storage
        env:
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          run_id=$(node -p "require('./rc/release-manifest.json').build.runId")
          name=$(node -p "require('./rc/release-manifest.json').artifact.ciArtifactName")
          if gh run download "$run_id" --name "$name" --dir ci-copy 2>download-error.txt; then
            ci_sha=$(sha256sum ci-copy/*.apk | cut -d' ' -f1)
            [ "$ci_sha" = "$SHA256" ] || { echo "::error title=Integrity::Release asset and CI artifact differ"; exit 1; }
            echo "✓ CI artifact $name (run $run_id) has the same SHA-256"
          else
            echo "::warning title=Integrity::CI artifact $name is no longer available; verified against release assets only."
          fi

      - name: Check stage order (previous stage must be recorded)
        id: order
        env:
          SHA256: ${{ steps.verify.outputs.sha256 }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          if node scripts/release/cli.js check-stage --record rc/release-record.json --stage "$STAGE" --sha256 "$SHA256"; then
            echo "resume=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Resume: PROD already recorded for this exact binary, but the final release was never created.
          last=$(node -p "const r=require('./rc/release-record.json'); const s=r.stages.at(-1); s.stage + ' ' + s.artifactSha256")
          if [ "$STAGE" = PROD ] && [ "$last" = "PROD $SHA256" ] && ! gh api "repos/$GH_REPO/releases/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::notice title=Resuming PROD::PROD is already recorded for this binary but release v$VERSION does not exist yet. This run re-checks and finishes the release without recording PROD twice."
            echo "resume=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          exit 1

      - name: Check the approval gate is configured
        run: |
          needs_approval=$(node -p "require('./scripts/release/stages').APPROVAL_STAGES.includes(process.argv[1])" "$STAGE")
          if [ "$needs_approval" != true ]; then
            echo "$STAGE has no approver by design (automatic stage)."; exit 0
          fi
          if ! rules=$(gh api "repos/$GH_REPO/environments/$STAGE" --jq '[.protection_rules[]?.type] | join(",")' 2>err.txt); then
            echo "::error title=Approval gate missing::GitHub Environment '$STAGE' was not found or cannot be read ($(cat err.txt)). Create it with required reviewers (docs/STAGES.md)."
            exit 1
          fi
          case ",$rules," in
            *,required_reviewers,*) echo "✓ Environment $STAGE requires reviewer approval ($rules)";;
            *) echo "::error title=Approval gate missing::Environment '$STAGE' has no required reviewers. Add them in Settings → Environments → $STAGE."; exit 1;;
          esac

      - name: Pass the verified files to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.run_id }}
          path: rc/
          retention-days: 7

  checks:
    name: ${{ inputs.stage }} checks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Approval happens here: the job waits until a required reviewer approves.
    # Only after approval does it receive this environment's variables and secrets.
    environment:
      name: ${{ inputs.stage }}
    permissions:
      contents: read
    env:
      SHA256: ${{ needs.verify.outputs.sha256 }}
      COMMIT: ${{ needs.verify.outputs.commit }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out release tooling (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools

      - name: Check out the candidate's source (${{ inputs.rc_tag }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
          path: candidate

      - name: Download the verified candidate (digest-checked)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.run_id }}
          path: rc

      - name: Artifact integrity (re-verified inside the environment)
        run: |
          node tools/scripts/release/cli.js verify rc --commit "$COMMIT"
          [ "$(sha256sum rc/*.apk | cut -d' ' -f1)" = "$SHA256" ]

      - name: Stage label
        run: |
          node -e '
            const s = require("./tools/scripts/release/stages").getStage(process.env.STAGE);
            console.log(`::notice title=${s.name} is ${s.kind.toUpperCase()}::${s.deployment}`);
          '

      - name: Sign-off notes present (QA, UAT)
        if: inputs.stage == 'QA' || inputs.stage == 'UAT'
        run: |
          if [ "$(printf '%s' "$NOTES" | tr -d '[:space:]')" = "" ]; then
            echo "::error title=Sign-off missing::$STAGE requires notes describing what was tested/accepted."; exit 1
          fi
          echo "Sign-off: $NOTES"

      - name: Set up Node.js
        if: inputs.stage != 'UAT'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install the candidate's dependencies
        if: inputs.stage != 'UAT'
        working-directory: candidate
        run: npm ci --no-audit --no-fund

      - name: QA - full unit and UI test suite at the candidate commit
        if: inputs.stage == 'QA'
        working-directory: candidate
        run: npm test -- --ci

      - name: QA - inspect the APK (identity and bundled JS)
        if: inputs.stage == 'QA'
        run: |
          apk=$(ls rc/*.apk)
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump badging "$apk" > badging.txt   # no pipe into head: avoids SIGPIPE (exit 141)
          head -1 badging.txt
          node -e '
            const { parseApkBadging } = require("./tools/scripts/release/lib");
            const actual = parseApkBadging(require("fs").readFileSync("badging.txt", "utf8"));
            const expected = require("./rc/release-manifest.json").platforms.android;
            for (const k of ["applicationId", "versionName", "versionCode"]) {
              if (actual[k] !== expected[k]) { console.error(`✗ ${k}: APK ${actual[k]} != manifest ${expected[k]}`); process.exit(1); }
            }
            console.log("✓ APK identity matches the manifest", actual);
          '
          unzip -l "$apk" | grep -q 'assets/index.android.bundle' && echo "✓ JS bundle present (runs without a dev server)"

      - name: SIT / PRE-PROD - live Supabase checks (read, write, RLS, constraints)
        if: inputs.stage == 'SIT' || inputs.stage == 'PRE-PROD'
        working-directory: candidate
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          INTEGRATION_REQUIRED: '1'
          INTEGRATION_MODE: full
        run: npm run test:integration -- --ci

      - name: PROD - read-only smoke check (no data written)
        if: inputs.stage == 'PROD'
        working-directory: candidate
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          INTEGRATION_REQUIRED: '1'
          INTEGRATION_MODE: readonly
        run: npm run test:integration -- --ci

      - name: Record which checks passed
        run: |
          # Reaching this step means every check above passed (any failure stops the job).
          node -e '
            const s = require("./tools/scripts/release/stages").getStage(process.env.STAGE);
            const checks = s.requiredChecks.map(name => ({ name, result: "passed" }));
            require("fs").writeFileSync("checks.json", JSON.stringify(checks, null, 2));
            console.log(checks);
          '

      - name: Keep stage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.rc_tag }}-${{ inputs.stage }}
          path: |
            checks.json
            badging.txt
          if-no-files-found: error
          retention-days: 90

  record:
    name: Record ${{ inputs.stage }}
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # update the release record; PROD: final tag and release
      actions: read # read who approved this run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
      COMMIT: ${{ needs.verify.outputs.commit }}
      VERSION: ${{ needs.verify.outputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified candidate (digest-checked)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.run_id }}
          path: rc

      - name: Download stage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ inputs.rc_tag }}-${{ inputs.stage }}
          path: evidence

      - name: PROD - final tag on the candidate's commit (before anything is recorded)
        if: inputs.stage == 'PROD'
        run: |
          final_tag="v${VERSION}"
          existing=$(gh api "repos/$GH_REPO/commits/$final_tag" --jq .sha 2>/dev/null || true)
          if [ -n "$existing" ]; then
            [ "$existing" = "$COMMIT" ] || { echo "::error title=Tag conflict::$final_tag exists but points to $existing, not $COMMIT"; exit 1; }
            echo "✓ $final_tag already points to $COMMIT"; exit 0
          fi
          if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$final_tag" -f sha="$COMMIT" --silent; then
            echo "::error title=Create the final tag yourself::GitHub did not allow the workflow token to create $final_tag (this happens when main has newer .github/workflows files than the candidate). Nothing was recorded. Run: git fetch --tags && git tag $final_tag $RC_TAG && git push origin $final_tag - then run Promote with stage PROD again; it will resume."
            exit 1
          fi
          echo "✓ Created $final_tag at $COMMIT"

      - name: Append the stage to the release record
        if: needs.verify.outputs.resume != 'true'
        run: |
          approvers=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | unique | join(",")')
          node scripts/release/cli.js promote --record rc/release-record.json \
            --stage "$STAGE" --sha256 "$SHA256" --by "$GITHUB_ACTOR" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --checks-file evidence/checks.json \
            ${approvers:+--approved-by "$approvers"} ${NOTES:+--notes "$NOTES"}
          gh release upload "$RC_TAG" rc/release-record.json --clobber

      - name: PROD - GitHub Release from the same files
        if: inputs.stage == 'PROD'
        run: |
          final_tag="v${VERSION}"
          build=$(node -p "require('./rc/release-manifest.json').buildNumber")
          cat > notes.md <<EOF
          **equipDemo ${VERSION}** (build ${build}), released to PROD from **${RC_TAG}** without rebuilding.

          | | |
          |---|---|
          | Source commit | \`${COMMIT}\` |
          | APK | \`$(ls rc/*.apk | xargs -n1 basename)\` |
          | SHA-256 | \`${SHA256}\` (identical at every stage) |
          | Stages | $(node -p "require('./rc/release-record.json').stages.map(s => s.stage + (s.kind === 'simulated' ? ' (simulated)' : '')).join(' → ')") |

          Internal distribution only. Full history: \`release-record.json\`.
          EOF
          gh release create "$final_tag" rc/* --verify-tag --latest \
            --title "equipDemo ${VERSION} (build ${build})" --notes-file notes.md

      - name: Keep a copy of this stage record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record-${{ inputs.rc_tag }}-${{ inputs.stage }}
          path: rc/release-record.json
          retention-days: 90

      - name: Summary
        run: |
          kind=$(node -p "require('./scripts/release/stages').getStage(process.env.STAGE).kind.toUpperCase()")
          {
            echo "### ${RC_TAG} entered **${STAGE}** (${kind})"
            echo ""
            echo "Binary SHA-256 \`${SHA256}\` from commit \`${COMMIT}\`: verified, not rebuilt."
            echo ""
            echo "| Stage | Kind | By | Approved by | At |"
            echo "|---|---|---|---|---|"
            node -e '
              for (const s of require("./rc/release-record.json").stages)
                console.log(`| ${s.stage} | ${s.kind} | ${s.by} | ${(s.approvedBy || []).join(", ") || "-"} | ${s.at} |`);
            '
          } >> "$GITHUB_STEP_SUMMARY"
