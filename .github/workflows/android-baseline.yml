name: Android baseline probe

# Phase 1 probe: does the current app build for Android, unchanged?
# Runs only on the probe branch or manually. Uses no secrets.
on:
  push:
    branches: [chore/phase1-baseline]
  workflow_dispatch:

jobs:
  android-build:
    name: Prebuild and assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor (informational)
        run: npx expo-doctor || true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Record APK
        run: ls -la android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: equipdemo-baseline-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
