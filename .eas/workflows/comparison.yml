# equipDemo platform comparison on EAS Workflows (trial branch only; not merged to main).
# Same representative pipeline as GitHub Actions and AWS CodeBuild: install, secret-file guard,
# version check, lint, typecheck, tests, Android release APK (EAS Build), manifest + checksum,
# verification, mock publishing gate, plus EAS's own approval step.
# Run from the project folder:  eas workflow:run .eas/workflows/comparison.yml
name: equipDemo comparison

jobs:
  checks:
    name: Lint, typecheck and test
    steps:
      - uses: eas/checkout
      - name: Source, secret-file guard, version check
        run: |
          set -euo pipefail
          echo "SOURCE REVISION: $(git rev-parse HEAD 2>/dev/null || echo 'not a git checkout (uploaded archive)')"
          echo "NODE: $(node --version)  JAVA: $(java -version 2>&1 | head -1)"
          tracked=$(git ls-files 2>/dev/null | grep -E '(^|/)\.env($|\.)|\.(jks|p12|p8|pem|key)$' | grep -vE '(^|/)\.env\.example$' || true)
          [ -z "$tracked" ] || { echo "Secret file guard: remove $tracked"; exit 1; }
          node scripts/release/cli.js version-check
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Tests
        run: |
          set -uo pipefail
          npm test -- --ci --json --outputFile=jest-results.json; rc=$?
          [ -f jest-results.json ] && node -e 'const r=require("./jest-results.json");console.log(`TEST RESULTS: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numTotalTests} total`)'
          exit $rc

  build_android:
    name: Android release APK (EAS Build)
    needs: [checks]
    type: build
    params:
      platform: android
      profile: comparison

  artifact_and_gate:
    name: Manifest, checksum and mock publishing gate
    needs: [build_android]
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: apk
        uses: eas/download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]
      - name: Manifest, checksum verification, mock gate
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.artifact_path }}"
          echo "APK: $apk"
          aapt2=""
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          fi
          [ -x "$aapt2" ] || { echo "aapt2 not found in this job image (ANDROID_HOME=${ANDROID_HOME:-unset})"; exit 1; }
          "$aapt2" dump badging "$apk" > badging.txt   # no pipe into head (SIGPIPE, see PR #19)
          head -1 badging.txt
          version=$(node -p "require('./package.json').version")
          BN=6001   # EAS comparison builds use 6000+; must match eas.json
          export GITHUB_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)" \
            GITHUB_REPOSITORY="keerthanarameshdasari-hub/equipment-demo-app" GITHUB_REF="eas-trial" \
            GITHUB_WORKFLOW="equipdemo-comparison" GITHUB_RUN_ID=0 GITHUB_RUN_NUMBER=0 GITHUB_RUN_ATTEMPT=1 \
            CI_PLATFORM="EAS Workflows" CI_RUN_URL="eas-build:${{ needs.build_android.outputs.build_id }}"
          node scripts/release/cli.js manifest --apk "$apk" --badging badging.txt \
            --rc-tag "v${version}-rc.1" --build-number "$BN" --out dist \
            --ci-artifact "eas:${{ needs.build_android.outputs.build_id }}" --retention-days 30 \
            --java "$(java -version 2>&1 | head -1)"
          echo "--- checksum verification"
          verify_args=(--version "$version")
          [ "$GITHUB_SHA" != unknown ] && verify_args+=(--commit "$GITHUB_SHA")
          node scripts/release/cli.js verify dist "${verify_args[@]}"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          echo "--- mock publishing gate: production without approval must be refused"
          node scripts/publish/cli.js metadata --out dist/publish-metadata.json \
            --application-id com.equipmentdemo.app --track production --rollout 10 --notes "EAS comparison" > /dev/null
          if node scripts/publish/cli.js validate --target mock --dir dist \
               --metadata dist/publish-metadata.json --log dist/publish-gate-log.json; then
            echo "GATE FAILED: production publishing accepted without approval"; exit 1
          fi
          echo "MOCK PUBLISHING GATE HELD: production refused (no PROD stage, no approval); nothing published (SIMULATED)"
      - uses: eas/upload_artifact
        with:
          name: equipdemo-comparison
          type: other
          path: dist/**/*

  approval:
    name: Human approval (EAS require-approval)
    needs: [artifact_and_gate]
    type: require-approval

  after_approval:
    name: Record approval (nothing is published)
    needs: [approval]
    steps:
      - run: echo "APPROVAL GRANTED in EAS. Nothing was published; store publishing stays SIMULATED (mock adapter only)."
